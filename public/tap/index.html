<title>Alif Rahman</title>

<style>
/* Layout: one phone-width bento of link tiles, centred; photo and name lead, save contact beside them. */
:root{
  --page:#e3ebed; --tile:#ffffff; --tile-fg:#12303a; --tile-mute:#587079; --ic-bg:#e1f1ef; --ic-fg:#0e8a85;
  --blue:#0f3d47; --green:#0e8a6a; --ink:#1a2630; --sun:#7fd8c8; --sun-fg:#06302b;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0a181b;--tile:#12282e;--tile-fg:#e6f2f2;--tile-mute:#8fb0b5;--ic-bg:#1b3a41;--ic-fg:#6fd3c4;--ink:#0c1518;--blue:#17606e;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0a181b;--tile:#12282e;--tile-fg:#e6f2f2;--tile-mute:#8fb0b5;--ic-bg:#1b3a41;--ic-fg:#6fd3c4;--ink:#0c1518;--blue:#17606e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--tile-fg);font-family:var(--f);font-size:15px;line-height:1.4;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.card{max-width:420px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.t{border-radius:24px;padding:16px;min-width:0;overflow:hidden;position:relative;display:block;transition:transform .15s ease}
a.t:active{transform:scale(.97)}
a.t:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (hover:hover){a.t:hover{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.t{transition:none}}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.photo{grid-row:span 2;padding:0;min-height:230px;background:var(--ink)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.name{background:var(--blue);color:#fff;display:grid;align-content:end;gap:6px}
.name h1{margin:0;font-size:25px;line-height:1.05;font-weight:800;letter-spacing:-.025em}
.name p{margin:0;font-size:13px;line-height:1.3;color:#a8d3d6;font-weight:600}
.save{background:var(--sun);color:var(--sun-fg);display:grid;align-content:space-between;gap:10px;font-weight:800;font-size:16px;line-height:1.15}
.save small{display:block;margin-top:3px;font-weight:500;font-size:11.5px;opacity:.8;line-height:1.3}
.s{display:grid;gap:14px;align-content:space-between;min-height:104px;font-weight:800;font-size:16px}
.s small{display:block;font-weight:500;font-size:12px;opacity:.85;overflow-wrap:anywhere;line-height:1.3;margin-top:2px}
.wa{background:var(--green);color:#fff}
.mail{background:var(--tile);color:var(--tile-fg)}
.mail .ico,.li .ico,.web .ico{color:var(--ic-fg)}
.mail small,.li small,.web small{color:var(--tile-mute);opacity:1}
.gh{background:var(--ink);color:#fff}
.li{background:var(--tile);color:var(--tile-fg)}
.web{grid-column:1/-1;background:var(--tile);color:var(--tile-fg);display:flex;gap:14px;align-items:center;font-weight:800;font-size:16px}
.web .ic{width:42px;height:42px;border-radius:13px;background:var(--ic-bg);display:grid;place-items:center;flex:none}
.web div{min-width:0}
.web .go{margin-left:auto;color:var(--tile-mute)}
.qrt{grid-column:1/-1;background:var(--tile);display:flex;gap:16px;align-items:center}
.qrbox{width:96px;flex:none;background:#fff;color:#101a3a;padding:8px;border-radius:14px}
.qrbox svg{display:block;width:100%;height:auto}
.qrt p{margin:0;font-size:13px;color:var(--tile-mute)}
.qrt b{display:flex;gap:6px;align-items:center;color:var(--tile-fg);font-size:15px;margin-bottom:3px}
</style></head><body>

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();

        var v = (b2 << 8) | b3;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
